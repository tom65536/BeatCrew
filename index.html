<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatCrew 🎶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   RESET & BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:     #FFD700;
  --gold-dim: #B8980A;
  --purple:   #7C3AED;
  --purple-dim:#4C1D95;
  --pink:     #EC4899;
  --cyan:     #22D3EE;
  --green:    #34D399;
  --bg:       #0D0817;
  --bg2:      #160D2C;
  --stage:    #1A0F35;
  --text:     #F3E8FF;
  --muted:    #6B7280;

  /* category colours */
  --beats-col:    #EF4444;
  --effects-col:  #A855F7;
  --melodies-col: #22D3EE;
  --voices-col:   #34D399;
}

html, body {
  height: 100%;
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  user-select: none;
}

/* =========================================================
   LAYOUT
   ========================================================= */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: relative;
}

/* -- BACKGROUND -- */
#bg-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* -- HEADER -- */
header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  background: linear-gradient(180deg, rgba(13,8,23,.98) 0%, transparent 100%);
  flex-shrink: 0;
}

#logo {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.6rem, 4vw, 2.8rem);
  background: linear-gradient(135deg, var(--gold) 0%, var(--pink) 60%, var(--purple) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  letter-spacing: 2px;
  filter: drop-shadow(0 0 12px rgba(255,215,0,.5));
}

#controls {
  display: flex;
  gap: 10px;
  align-items: center;
}

.ctrl-btn {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 50px;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: .8rem;
  padding: 8px 18px;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-btn:hover { background: rgba(255,215,0,.18); border-color: var(--gold); color: var(--gold); }
.ctrl-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
.ctrl-btn svg { width: 16px; height: 16px; }

/* bpm-display removed */

/* -- STAGE (characters) -- */
#stage-wrap {
  position: relative;
  z-index: 5;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
  min-height: 0;
}

/* fog & lights */
#fog {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 120px;
  background: linear-gradient(to top, rgba(124,58,237,.18) 0%, transparent 100%);
  pointer-events: none;
}

#disco-ball {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 56px;
  height: 56px;
  pointer-events: none;
}

#stage-lights {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  overflow: hidden;
}
.stage-light {
  position: absolute;
  top: 0;
  width: 180px;
  height: 100%;
  opacity: 0;
  border-radius: 0 0 50% 50%;
  animation: lightPulse 4s ease-in-out infinite;
}

@keyframes lightPulse {
  0%,100% { opacity: 0; }
  50%      { opacity: .07; }
}

#characters {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: clamp(4px, 1.5vw, 18px);
  padding: 0 10px 0 10px;
  width: 100%;
  position: relative;
  z-index: 5;
}

/* -- CHARACTER -- */
.char-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1 1 0;
  max-width: 130px;
  cursor: pointer;
  position: relative;
  transition: filter .3s;
}

.char-wrap.muted { filter: grayscale(.9) brightness(.4); }
.char-wrap.solo-active { filter: drop-shadow(0 0 18px var(--gold)) brightness(1.2); }
.char-wrap.solo-dimmed { filter: brightness(.3) saturate(.3); }

.char-svg-wrap {
  width: 100%;
  position: relative;
}

.char-svg-wrap svg { width: 100%; height: auto; display: block; }

/* animated glow ring behind active chars */
.char-glow {
  position: absolute;
  bottom: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  height: 30%;
  border-radius: 50%;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
  filter: blur(10px);
}
.char-wrap.active .char-glow { opacity: 1; }

/* char-name removed */

/* drop zone highlight */
.char-wrap.drag-over .char-svg-wrap {
  filter: drop-shadow(0 0 16px var(--gold));
}

/* -- SOUND PANEL -- */
#sound-panel {
  position: relative;
  z-index: 10;
  flex-shrink: 0;
  background: linear-gradient(180deg, transparent, rgba(13,8,23,.98) 20%);
  padding: 6px 10px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#visualizer-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 4px;
}
#visualizer {
  width: min(320px, 90vw);
  height: 36px;
}

.category-row {
  display: flex;
  align-items: center;
  margin-bottom: 5px;
  gap: 6px;
}

/* cat-label removed */

.cat-icons {
  display: flex;
  gap: 5px;
  flex-wrap: nowrap;
}

/* SOUND ICON */
.sound-icon {
  width: clamp(42px, 10vw, 58px);
  height: clamp(42px, 10vw, 58px);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: grab;
  border: 2px solid transparent;
  transition: all .15s;
  position: relative;
  flex-shrink: 0;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.sound-icon:active { cursor: grabbing; }
.sound-icon.assigned { opacity: .45; cursor: default; }
.sound-icon.assigned::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: rgba(0,0,0,.4);
}
.sound-icon:not(.assigned):hover {
  transform: scale(1.1) translateY(-2px);
  box-shadow: 0 0 14px currentColor;
}
.sound-icon .icon-emoji { font-size: 1.3rem; line-height: 1; }
.sound-icon .icon-label { display: none; }

/* drag ghost */
#drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: .85;
  transform: scale(1.2);
  display: none;
}

/* Toast */
#toast {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255,215,0,.92);
  color: #000;
  font-weight: 700;
  font-size: .85rem;
  padding: 8px 20px;
  border-radius: 50px;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  pointer-events: none;
  z-index: 999;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */
@keyframes headBob    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes footTap    { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(8deg)} }
@keyframes armRaise   { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-20deg)} }
@keyframes sway       { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
@keyframes fingerSnap { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes mouthOpen  { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.4)} }
@keyframes discoSpin  { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes glitter    { 0%,100%{opacity:0} 50%{opacity:1} }
@keyframes particleFly { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(.3)} }

</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div id="app">
  <header>

    <div id="controls">
      <button class="ctrl-btn" id="btn-play">

  <div id="stage-wrap">

</div>

<div id="drag-ghost"></div>

<script>
/* ================================================================
   BeatCrew — All-in-one Web Audio Beat Mixer
   Audio: Web Audio API, procedural synthesis
   ================================================================ */

// ----------------------------------------------------------------
// CONSTANTS
// ----------------------------------------------------------------
const BPM    = 120;
const BEATS  = 4;         // bars per loop (all loops = 4 beats)
const SPB    = 60 / BPM;  // seconds per beat
const LOOP   = SPB * BEATS; // loop duration in seconds

// ----------------------------------------------------------------
// SOUND DEFINITIONS  — 20 sounds, 4 categories × 5
// 3 Disco + 1 style-alien per category (5th is bonus variant)
// ----------------------------------------------------------------
const CATEGORIES = [
  { id: 'beats',    label: 'Beats',    color: '#EF4444', icons: ['🥁','🔊','💥','⚡','🎺'] },
  { id: 'effects',  label: 'Effects',  color: '#A855F7', icons: ['🌀','🔮','🎸','💫','🤖'] },
  { id: 'melodies', label: 'Melodies', color: '#22D3EE', icons: ['🎹','🎷','🎻','🪗','🔔'] },
  { id: 'voices',   label: 'Voices',   color: '#34D399', icons: ['🎤','🎙️','🗣️','😤','🤖'] },
];

// Sound spec: { id, cat, name, emoji, synth fn, accessory, anim }
const SOUNDS = [
  /* ---- BEATS ---- */
  { id:'b1', cat:'beats',    name:'Disco Kick',   emoji:'🥁', accessory:'cap',       anim:'beat',    synth:'kickDisco'   },
  { id:'b2', cat:'beats',    name:'Funky Snare',  emoji:'🔊', accessory:'sunglasses',anim:'beat',    synth:'snareFunky'  },
  { id:'b3', cat:'beats',    name:'Hi-Hat Groove',emoji:'💥', accessory:'cap2',      anim:'beat',    synth:'hihat'       },
  { id:'b4', cat:'beats',    name:'Metal Blast',  emoji:'⚡', accessory:'mask',      anim:'beat',    synth:'metalBlast'  },
  { id:'b5', cat:'beats',    name:'Perc Cowbell', emoji:'🎺', accessory:'headband',  anim:'beat',    synth:'cowbell'     },
  /* ---- EFFECTS / GUITAR ---- */
  { id:'e1', cat:'effects',  name:'Filter Sweep', emoji:'🌀', accessory:'headphones',anim:'effect',  synth:'filterSweep' },
  { id:'e2', cat:'effects',  name:'Disco Strings',emoji:'🎻', accessory:'chain',     anim:'effect',  synth:'discoFX'     },
  { id:'e3', cat:'effects',  name:'Clean Guitar Chords', emoji:'🎸', accessory:'jacket', anim:'effect', synth:'stabSynth'   },
  { id:'e4', cat:'effects',  name:'Techno Zap',   emoji:'💫', accessory:'visor',     anim:'effect',  synth:'technoZap'   },
  { id:'e5', cat:'effects',  name:'Wah Guitar Lick', emoji:'✨', accessory:'robot_head',anim:'effect', synth:'flanger'     },
  /* ---- MELODIES ---- */
  { id:'m1', cat:'melodies', name:'Fingerstyle Bass', emoji:'🎸', accessory:'collar', anim:'melody',  synth:'bassGroove'  },
  { id:'m2', cat:'melodies', name:'Disco Rhythm Guitar', emoji:'🎶', accessory:'scarf', anim:'melody', synth:'funkyClavinet'},
  { id:'m3', cat:'melodies', name:'Electric Piano', emoji:'🎹', accessory:'bow_tie', anim:'melody',  synth:'discoChord'  },
  { id:'m4', cat:'melodies', name:'Clean Guitar Lead', emoji:'🪕', accessory:'belt', anim:'melody',  synth:'arpeggioRun' },
  { id:'m5', cat:'melodies', name:'Distorted Rock Riff', emoji:'⚡', accessory:'wristband', anim:'melody', synth:'metalRiff' },
  /* ---- VOICES ---- */
  { id:'v1', cat:'voices',   name:'"Come On!"',   emoji:'🎤', accessory:'microphone',anim:'voice',   synth:'vocalComeOn' },
  { id:'v2', cat:'voices',   name:'Ooh-Yeah Vocal', emoji:'🎙️', accessory:'afro',    anim:'voice',   synth:'vocalOohYeah'},
  { id:'v3', cat:'voices',   name:'"Celebrate"',  emoji:'🗣️', accessory:'big_hat',   anim:'voice',   synth:'vocalDance'  },
  { id:'v4', cat:'voices',   name:'Expressive Scat', emoji:'😤', accessory:'bandana', anim:'voice',   synth:'vocalScat'   },
  { id:'v5', cat:'voices',   name:'Vocoder Chant', emoji:'🤖', accessory:'antenna',  anim:'voice',   synth:'vocalRobot'  },
];

// Chord progression: Cmaj7 – Am7 – Dm7 – G7 (root notes in MIDI)
// C=60, A=57, D=62, G=55
const CHORD_ROOTS = [60, 57, 62, 55]; // one per beat
const CHORD_TONES = [
  [60,64,67,71], // Cmaj7
  [57,60,64,67], // Am7
  [62,65,69,72], // Dm7
  [55,59,62,65], // G7
];
const midiToHz = n => 440 * Math.pow(2, (n-69)/12);

// ----------------------------------------------------------------
// CHARACTERS — 7 cartoon beatboxers (SVG-drawn inline)
// ----------------------------------------------------------------
const CHAR_DEFS = [
  { id:0, name:'Luna',  skin:'#FDDCB5', hair:'#8B4513', dress:'#E879F9', belt:'#FFD700', shoe:'#A855F7' },
  { id:1, name:'Zack',  skin:'#8D5524', hair:'#1A1A1A', dress:'#3B82F6', belt:'#EF4444', shoe:'#FFD700' },
  { id:2, name:'Mia',   skin:'#FBBF24', hair:'#EC4899', dress:'#F97316', belt:'#A855F7', shoe:'#22D3EE' },
  { id:3, name:'Rico',  skin:'#C68642', hair:'#4B2C20', dress:'#10B981', belt:'#FFD700', shoe:'#EF4444' },
  { id:4, name:'Kai',   skin:'#F5CBA7', hair:'#FFD700', dress:'#EC4899', belt:'#22D3EE', shoe:'#A855F7' },
  { id:5, name:'Nova',  skin:'#7D4E24', hair:'#9D174D', dress:'#8B5CF6', belt:'#34D399', shoe:'#F97316' },
  { id:6, name:'Dex',   skin:'#FFFDE7', hair:'#374151', dress:'#EF4444', belt:'#FFD700', shoe:'#10B981' },
];

// ----------------------------------------------------------------
// AUDIO ENGINE
// ----------------------------------------------------------------
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.analyser = null;
    this.transport = null; // { startTime, bar, nextBarTime }
    this.scheduledNodes = []; // cleanup list
    this.lookahead    = 0.1;  // seconds ahead to schedule
    this.schedInterval= 50;   // ms polling
    this.schedTimer   = null;
    this.playing      = false;
    this.activeSlots  = {};   // charId -> soundId
    this.mutedChars   = new Set();
    this.soloChar     = null;
    this.beat         = 0;    // current beat 0-3
    this.bar          = 0;
    this.onBeat       = null; // callback(beat, time)
    this.initialized  = false;
  }

  async init() {
    if (this.initialized) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();

    // --- SIGNAL CHAIN: instruments → dry+wet → compressor → master → analyser → out ---
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.001;

    // Compressor — glues the mix, prevents clipping
    this.comp = this.ctx.createDynamicsCompressor();
    this.comp.threshold.value = -18;
    this.comp.knee.value      = 12;
    this.comp.ratio.value     = 4;
    this.comp.attack.value    = 0.005;
    this.comp.release.value   = 0.15;

    // Reverb — algorithmic via convolver with generated impulse
    this.reverbGain = this.ctx.createGain();
    this.reverbGain.gain.value = 0.35;
    this.convolver = this.ctx.createConvolver();
    this.convolver.buffer = this._createReverbIR(2.2, 3.5);

    // Dry bus
    this.dryBus = this.ctx.createGain();
    this.dryBus.gain.value = 0.75;

    // Wet bus
    this.wetBus = this.ctx.createGain();
    this.wetBus.gain.value = 0.35;

    // Master lowpass — remove any remaining harsh highs above ~14kHz
    this.masterLP = this.ctx.createBiquadFilter();
    this.masterLP.type = 'lowpass';
    this.masterLP.frequency.value = 14000;
    this.masterLP.Q.value = 0.5;

    // Analyser
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 256;

    // Routing
    //   this.dryBus ──────────────────────────┐
    //   this.wetBus → convolver → reverbGain ─┤→ masterLP → comp → master → analyser → dest
    this.dryBus.connect(this.masterLP);
    this.wetBus.connect(this.convolver);
    this.convolver.connect(this.reverbGain);
    this.reverbGain.connect(this.masterLP);
    this.masterLP.connect(this.comp);
    this.comp.connect(this.master);
    this.master.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);

    // Pre-generate noise buffer (reusable)
    const noiseDur = 4;
    this._noiseBuf = this.ctx.createBuffer(2, this.ctx.sampleRate * noiseDur, this.ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = this._noiseBuf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }

    // Waveshaper curves (reusable)
    this._softClipCurve = this._makeSoftClip(3);
    this._warmSatCurve  = this._makeWarmSat();
    this._hardClipCurve = this._makeSoftClip(12);

    this.initialized = true;
  }

  // Generate a reverb impulse response procedurally
  _createReverbIR(duration, decay) {
    const len  = this.ctx.sampleRate * duration;
    const buf  = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        // Exponential decay noise with early reflections
        const t = i / this.ctx.sampleRate;
        const env = Math.exp(-t * decay);
        // Add a few early reflections as impulses
        let early = 0;
        if (i === Math.floor(0.012 * this.ctx.sampleRate)) early = 0.6;
        if (i === Math.floor(0.025 * this.ctx.sampleRate)) early = 0.4;
        if (i === Math.floor(0.041 * this.ctx.sampleRate)) early = 0.3;
        if (i === Math.floor(0.058 * this.ctx.sampleRate)) early = 0.2;
        data[i] = ((Math.random() * 2 - 1) * env + early) * 0.5;
      }
    }
    return buf;
  }

  _makeSoftClip(amount) {
    const n = 8192;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
    }
    return curve;
  }

  _makeWarmSat() {
    const n = 4096;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      // Warm tube-style saturation
      if (x >= 0) curve[i] = 1 - Math.exp(-x * 2.5);
      else curve[i] = -(1 - Math.exp(x * 2.5));
    }
    return curve;
  }

  start() {
    if (this.playing) return;
    this.playing = true;
    const now = this.ctx.currentTime + 0.05;
    this.transport = { nextBeatTime: now, beat: 0, bar: 0 };
    this.master.gain.cancelScheduledValues(0);
    this.master.gain.setTargetAtTime(0.82, this.ctx.currentTime, 0.3);
    this._schedule();
    this.schedTimer = setInterval(() => this._schedule(), this.schedInterval);
  }

  stop() {
    if (!this.playing) return;
    this.playing = false;
    clearInterval(this.schedTimer);
    this.master.gain.setTargetAtTime(0.001, this.ctx.currentTime, 0.25);
    this.beat = 0;
    this.bar  = 0;
  }

  _schedule() {
    const ctx = this.ctx;
    const ahead = ctx.currentTime + this.lookahead;
    while (this.transport.nextBeatTime < ahead) {
      const t    = this.transport.nextBeatTime;
      const beat = this.transport.beat;
      const bar  = this.transport.bar;

      // fire callback (visual sync)
      const delay = (t - ctx.currentTime) * 1000;
      setTimeout(() => {
        this.beat = beat;
        if (this.onBeat) this.onBeat(beat, t);
      }, Math.max(0, delay));

      // play all active sounds for this beat
      for (const [charIdStr, soundId] of Object.entries(this.activeSlots)) {
        const charId = parseInt(charIdStr);
        if (!this._isAudible(charId)) continue;
        const sound = SOUNDS.find(s => s.id === soundId);
        if (sound) this._playSound(sound, beat, bar, t);
      }

      this.transport.nextBeatTime += SPB;
      this.transport.beat = (beat + 1) % BEATS;
      if (this.transport.beat === 0) this.transport.bar++;
    }
  }

  _isAudible(charId) {
    if (this.mutedChars.has(charId)) return false;
    if (this.soloChar !== null && this.soloChar !== charId) return false;
    return true;
  }

  _playSound(sound, beat, bar, t) {
    const f = this[sound.synth];
    if (f) f.call(this, beat, bar, t);
  }

  // ================================================================
  //  HELPERS — warm, filtered, layered
  // ================================================================

  // Routed gain node (dry + wet send)
  _out(vol, t, dur, wetAmount) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.setTargetAtTime(0.0001, t + dur * 0.7, dur * 0.18);
    const wet = typeof wetAmount === 'number' ? wetAmount : 0.35;
    const dg = this.ctx.createGain(); dg.gain.value = 1;
    const wg = this.ctx.createGain(); wg.gain.value = wet;
    g.connect(dg); dg.connect(this.dryBus);
    g.connect(wg); wg.connect(this.wetBus);
    return g;
  }

  // Exponential-decay gain (for drums & guitar plucks)
  _drumOut(vol, t, dur, wetAmount) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const wet = typeof wetAmount === 'number' ? wetAmount : 0.2;
    const dg = this.ctx.createGain(); dg.gain.value = 1;
    const wg = this.ctx.createGain(); wg.gain.value = wet;
    g.connect(dg); dg.connect(this.dryBus);
    g.connect(wg); wg.connect(this.wetBus);
    return g;
  }

  // Natural Electric Guitar Pluck / Strum Note (Clean Fender / Gibson Tone)
  _guitarNote(freq, t, dur, vol, isMuted = false, wetAmt = 0.35) {
    const actualDur = isMuted ? 0.09 : dur;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.003); // Quick pick attack
    if (isMuted) {
      g.gain.exponentialRampToValueAtTime(0.0001, t + actualDur);
    } else {
      g.gain.setTargetAtTime(vol * 0.5, t + 0.02, 0.08); // Pluck settle
      g.gain.exponentialRampToValueAtTime(0.0001, t + actualDur);
    }

    // Amp & pickup emulation (dual resonant peak around 2.8kHz and 4.2kHz, warm low cut)
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 90;
    const pickup = this.ctx.createBiquadFilter();
    pickup.type = 'peaking'; pickup.frequency.value = 2800; pickup.Q.value = 1.4; pickup.gain.value = 3;
    const cabLP = this.ctx.createBiquadFilter();
    cabLP.type = 'lowpass'; cabLP.frequency.value = isMuted ? 1800 : 4800; cabLP.Q.value = 0.7;

    // Pick attack click (tiny burst of body resonance)
    const pickSrc = this.ctx.createBufferSource();
    pickSrc.buffer = this._noiseBuf;
    const pickFilt = this.ctx.createBiquadFilter();
    pickFilt.type = 'bandpass'; pickFilt.frequency.value = 2200; pickFilt.Q.value = 3;
    const pickG = this.ctx.createGain();
    pickG.gain.setValueAtTime(vol * 0.35, t);
    pickG.gain.exponentialRampToValueAtTime(0.0001, t + 0.015);
    pickSrc.connect(pickFilt); pickFilt.connect(pickG); pickG.connect(cabLP);
    pickSrc.start(t); pickSrc.stop(t + 0.02);

    // Warm tube clean preamp
    const sat = this.ctx.createWaveShaper();
    sat.curve = this._warmSatCurve;

    // String synthesis: Fundamental + rich natural electric guitar harmonics (Karplus/harmonic blend)
    const harmonics = [
      { ratio: 1, g: 0.65, type: 'triangle' },
      { ratio: 2, g: 0.35, type: 'sine' },
      { ratio: 3, g: 0.22, type: 'sine' },
      { ratio: 4, g: 0.12, type: 'sine' },
      { ratio: 5, g: 0.06, type: 'triangle' }
    ];

    harmonics.forEach(h => {
      const o = this.ctx.createOscillator();
      o.type = h.type;
      o.frequency.setValueAtTime(freq * h.ratio, t);
      // Slight string micro-detune
      o.detune.value = (Math.random() - 0.5) * 4;
      const hg = this.ctx.createGain();
      hg.gain.value = h.g;
      o.connect(hg);
      hg.connect(sat);
      o.start(t);
      o.stop(t + actualDur + 0.05);
    });

    sat.connect(hp);
    hp.connect(pickup);
    pickup.connect(cabLP);
    cabLP.connect(g);

    const dg = this.ctx.createGain(); dg.gain.value = 1;
    const wg = this.ctx.createGain(); wg.gain.value = wetAmt;
    g.connect(dg); dg.connect(this.dryBus);
    g.connect(wg); wg.connect(this.wetBus);
  }

  // Natural Human Formant Voice Generator (Glottal pulse wave + 3 acoustic vocal tract resonances + vibrato)
  _humanVoice(freq, formants, t, dur, vol, vibratoStart = 0.12, wetAmt = 0.45) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.035); // Gentle vocal onset
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    // Vocal cord vibrato (5.2 Hz LFO, starts after onset)
    const vibLFO = this.ctx.createOscillator();
    vibLFO.frequency.value = 5.2;
    const vibGain = this.ctx.createGain();
    vibGain.gain.setValueAtTime(0.0001, t);
    vibGain.gain.setTargetAtTime(8, t + vibratoStart, 0.08); // 8 cents vibrato
    vibLFO.connect(vibGain);

    // Glottal source (soft asymmetrical pulse approximating human vocal folds)
    const o1 = this.ctx.createOscillator();
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(freq, t);
    vibGain.connect(o1.detune);

    const o2 = this.ctx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(freq, t);
    o2.detune.value = 3;
    vibGain.connect(o2.detune);

    const glottalMix = this.ctx.createGain();
    glottalMix.gain.value = 0.5;
    o1.connect(glottalMix);
    o2.connect(glottalMix);

    // Vocal Tract Formant Filters (Mouth, Throat, Nasal Cavity)
    const formantOut = this.ctx.createGain();
    formantOut.gain.value = 1.0;

    formants.forEach(([fFreq, qVal, fGain]) => {
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(fFreq, t);
      bp.Q.setValueAtTime(qVal, t);
      const fg = this.ctx.createGain();
      fg.gain.setValueAtTime(fGain, t);
      glottalMix.connect(bp);
      bp.connect(fg);
      fg.connect(formantOut);
    });

    // Body warmth filter
    const voiceLP = this.ctx.createBiquadFilter();
    voiceLP.type = 'lowpass';
    voiceLP.frequency.value = 4500;
    voiceLP.Q.value = 0.5;

    formantOut.connect(voiceLP);
    voiceLP.connect(g);

    const dg = this.ctx.createGain(); dg.gain.value = 0.75;
    const wg = this.ctx.createGain(); wg.gain.value = wetAmt;
    g.connect(dg); dg.connect(this.dryBus);
    g.connect(wg); wg.connect(this.wetBus);

    vibLFO.start(t); vibLFO.stop(t + dur + 0.1);
    o1.start(t); o1.stop(t + dur + 0.1);
    o2.start(t); o2.stop(t + dur + 0.1);
  }

  // Warm oscillator: 2 detuned oscillators through a lowpass filter
  _warmOsc(type, freq, t, dur, vol, lpFreq, wetAmt) {
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = lpFreq || 3000; lp.Q.value = 0.7;
    const g = this._out(vol, t, dur, wetAmt);
    lp.connect(g);
    // Main osc
    const o1 = this.ctx.createOscillator();
    o1.type = type; o1.frequency.value = freq;
    o1.connect(lp);
    // Detuned layer for warmth
    const o2 = this.ctx.createOscillator();
    o2.type = type; o2.frequency.value = freq;
    o2.detune.value = 8; // subtle chorus
    const g2 = this.ctx.createGain(); g2.gain.value = 0.5;
    o2.connect(g2); g2.connect(lp);
    o1.start(t); o1.stop(t + dur + 0.3);
    o2.start(t); o2.stop(t + dur + 0.3);
    return { osc: o1, osc2: o2, gain: g, lp };
  }

  // Filtered noise with proper envelope
  _filtNoise(t, dur, vol, loFreq, hiFreq, wetAmt) {
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = (loFreq + hiFreq) / 2;
    bp.Q.value = ((hiFreq - loFreq) > 2000) ? 0.5 : 2;
    const g = this._drumOut(vol, t, dur, wetAmt);
    src.connect(bp); bp.connect(g);
    src.start(t); src.stop(t + dur + 0.05);
    return src;
  }

  // Formant vocal note (sawtooth through parallel formant filters)
  _formantNote(freq, formants, t, dur, vol, wetAmt) {
    const g = this._out(vol, t, dur, wetAmt);
    // Source: 3 slightly detuned saws
    const merger = this.ctx.createGain(); merger.gain.value = 1;
    merger.connect(g);
    for (let d = -6; d <= 6; d += 6) {
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = d;
      // Each formant filter
      formants.forEach(([ff, q, gain]) => {
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const fg = this.ctx.createGain(); fg.gain.value = gain;
        o.connect(bp); bp.connect(fg); fg.connect(merger);
      });
      o.start(t); o.stop(t + dur + 0.2);
    }
  }

  // ================================================================
  //  BEATS — punchier, warmer drums
  // ================================================================

  kickDisco(beat, bar, t) {
    if (beat !== 0 && beat !== 2) return;

    // Sub body — sine sweep from 160 → 42 Hz, warm and round
    const o = this.ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    // Second harmonic for body
    const o2 = this.ctx.createOscillator();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(320, t);
    o2.frequency.exponentialRampToValueAtTime(84, t + 0.08);
    const g2 = this.ctx.createGain(); g2.gain.setValueAtTime(0.3, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);

    const g = this._drumOut(0.7, t, 0.35, 0.15);
    // Warm saturation
    const sat = this.ctx.createWaveShaper(); sat.curve = this._warmSatCurve;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 0.5;
    o.connect(sat); o2.connect(g2); g2.connect(sat);
    sat.connect(lp); lp.connect(g);
    o.start(t); o.stop(t + 0.4);
    o2.start(t); o2.stop(t + 0.12);

    // Soft click (not harsh noise — filtered click)
    const click = this.ctx.createOscillator();
    click.type = 'sine'; click.frequency.value = 3500;
    const cg = this._drumOut(0.12, t, 0.008, 0);
    const clp = this.ctx.createBiquadFilter();
    clp.type = 'lowpass'; clp.frequency.value = 5000;
    click.connect(clp); clp.connect(cg);
    click.start(t); click.stop(t + 0.02);
  }

  snareFunky(beat, bar, t) {
    if (beat !== 1 && beat !== 3) return;

    // Body — two pitched tones for fullness
    const o1 = this.ctx.createOscillator();
    o1.type = 'triangle'; o1.frequency.value = 185;
    const o2 = this.ctx.createOscillator();
    o2.type = 'sine'; o2.frequency.value = 240;
    const bodyG = this._drumOut(0.35, t, 0.12, 0.3);
    const bodyLP = this.ctx.createBiquadFilter();
    bodyLP.type = 'lowpass'; bodyLP.frequency.value = 1800;
    o1.connect(bodyLP); o2.connect(bodyLP); bodyLP.connect(bodyG);
    o1.start(t); o1.stop(t + 0.15);
    o2.start(t); o2.stop(t + 0.1);

    // Snare rattle — filtered noise, mid-range, NOT harsh high noise
    this._filtNoise(t, 0.14, 0.3, 1200, 6000, 0.3);
  }

  hihat(beat, bar, t) {
    // Closed hi-hat: metallic square oscillators at inharmonic ratios, heavily filtered
    const playHH = (time, vol, dur) => {
      const g = this._drumOut(vol, time, dur, 0.15);
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 8500; bp.Q.value = 1.2;
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 12000; lp.Q.value = 0.5;
      // Mix of metallic square tones at non-harmonic ratios
      [587, 845, 1267, 1578].forEach((f, i) => {
        const o = this.ctx.createOscillator();
        o.type = 'square'; o.frequency.value = f;
        const og = this.ctx.createGain(); og.gain.value = 0.04 / (i + 1);
        o.connect(og); og.connect(bp);
        o.start(time); o.stop(time + dur + 0.02);
      });
      // Plus a touch of filtered noise for realism
      const ns = this.ctx.createBufferSource(); ns.buffer = this._noiseBuf;
      const ng = this.ctx.createGain(); ng.gain.setValueAtTime(vol * 0.4, time);
      ng.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      const nhp = this.ctx.createBiquadFilter(); nhp.type = 'highpass'; nhp.frequency.value = 7000;
      ns.connect(nhp); nhp.connect(ng); ng.connect(bp);
      ns.start(time); ns.stop(time + dur + 0.02);
      bp.connect(lp); lp.connect(g);
    };

    playHH(t, 0.18, 0.06);
    // Offbeat (softer)
    const tHalf = t + SPB / 2;
    playHH(tHalf, 0.1, 0.04);
  }

  metalBlast(beat, bar, t) {
    if (beat !== 0) return;
    // Distorted power chord — but through a cab-sim (lowpass) so it doesn't shred ears
    const root = 82.41; // E2
    const fifth = root * 1.5;
    const oct   = root * 2;
    [root, fifth, oct].forEach(freq => {
      const o = this.ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = freq;
      const o2 = this.ctx.createOscillator();
      o2.type = 'square'; o2.frequency.value = freq * 1.002;
      const mix = this.ctx.createGain(); mix.gain.value = 0.5;
      o2.connect(mix);
      // Distortion
      const ws = this.ctx.createWaveShaper(); ws.curve = this._hardClipCurve;
      ws.oversample = '4x';
      // Cabinet sim: lowpass at 4kHz, cuts fizz
      const cab = this.ctx.createBiquadFilter();
      cab.type = 'lowpass'; cab.frequency.value = 3500; cab.Q.value = 0.8;
      const g = this._drumOut(0.18, t, 0.5, 0.4);
      o.connect(ws); mix.connect(ws); ws.connect(cab); cab.connect(g);
      o.start(t); o.stop(t + 0.55);
      o2.start(t); o2.stop(t + 0.55);
    });
  }

  cowbell(beat, bar, t) {
    // Classic 808 cowbell — bandpass-filtered, warm
    const g = this._drumOut(0.15, t, (beat % 2 === 0 ? 0.35 : 0.2), 0.3);
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 720; bp.Q.value = 4;
    [562, 845].forEach(f => {
      const o = this.ctx.createOscillator();
      o.type = 'triangle'; o.frequency.value = f;
      o.connect(bp);
      o.start(t); o.stop(t + 0.5);
    });
    bp.connect(g);
  }

  // ================================================================
  //  EFFECTS — lush, filtered, spatial
  // ================================================================

  filterSweep(beat, bar, t) {
    if (beat !== 0) return;
    // Classic 70s Disco Philly Strings Sweep / Swell (rich violins swell across the 4 bars)
    const root = midiToHz(CHORD_ROOTS[bar % 4]);
    const chord = CHORD_TONES[bar % 4];
    const dur = LOOP * 0.96;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.6); // Warm string swell
    g.gain.setValueAtTime(0.14, t + dur * 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    // Warm orchestral acoustic lowpass
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1400, t);
    lp.frequency.linearRampToValueAtTime(3200, t + dur * 0.6);
    lp.frequency.linearRampToValueAtTime(1600, t + dur);
    lp.Q.value = 0.5;

    chord.forEach(note => {
      [-4, 0, 4].forEach(det => {
        const o = this.ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = midiToHz(note + 12);
        o.detune.value = det;
        const og = this.ctx.createGain(); og.gain.value = 0.04;
        o.connect(og); og.connect(lp);
        o.start(t); o.stop(t + dur + 0.1);
      });
    });

    lp.connect(g);
    const dg = this.ctx.createGain(); dg.gain.value = 0.6;
    const wg = this.ctx.createGain(); wg.gain.value = 0.5;
    g.connect(dg); dg.connect(this.dryBus);
    g.connect(wg); wg.connect(this.wetBus);
  }

  discoFX(beat, bar, t) {
    // Disco String Section Stabs (authentic Philly disco violin hits on 2 & 4)
    if (beat % 2 !== 0) return;
    const chord = CHORD_TONES[beat % 4];
    const dur = 0.24;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.03);
    g.gain.setTargetAtTime(0.0001, t + 0.12, 0.06);

    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 3600; lp.Q.value = 0.5;

    chord.slice(0, 3).forEach(n => {
      [-5, 0, 5].forEach(det => {
        const o = this.ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = midiToHz(n + 12);
        o.detune.value = det;
        const og = this.ctx.createGain(); og.gain.value = 0.06;
        o.connect(og); og.connect(lp);
        o.start(t); o.stop(t + dur + 0.1);
      });
    });

    lp.connect(g);
    const dg = this.ctx.createGain(); dg.gain.value = 0.7;
    const wg = this.ctx.createGain(); wg.gain.value = 0.5;
    g.connect(dg); dg.connect(this.dryBus);
    g.connect(wg); wg.connect(this.wetBus);
  }

  stabSynth(beat, bar, t) {
    // Clean Funk Electric Guitar Chord Stabs (Nile Rodgers "Chic" style chucks & stabs)
    const chord = CHORD_TONES[beat % 4];
    // Strum pattern: syncopated funk 16ths
    const strums = [
      { offset: 0, muted: false, vol: 0.16 },
      { offset: SPB * 0.5, muted: true, vol: 0.12 },
      { offset: SPB * 0.75, muted: false, vol: 0.14 }
    ];

    strums.forEach(st => {
      const stTime = t + st.offset;
      chord.slice(0, 3).forEach((n, idx) => {
        // Natural human strum timing offset (1-2ms per string)
        const stringTime = stTime + idx * 0.004;
        this._guitarNote(midiToHz(n), stringTime, 0.22, st.vol, st.muted, 0.3);
      });
    });
  }

  technoZap(beat, bar, t) {
    // Style-alien effect: Space Laser Zap with spring reverb tail
    const playZap = (time) => {
      const o = this.ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(1800, time);
      o.frequency.exponentialRampToValueAtTime(140, time + 0.12);
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 3200; lp.Q.value = 2;
      const g = this._drumOut(0.2, time, 0.14, 0.4);
      o.connect(lp); lp.connect(g);
      o.start(time); o.stop(time + 0.16);
    };
    playZap(t + SPB * 0.5);
  }

  flanger(beat, bar, t) {
    // Wah-Wah Clean Electric Guitar Riff (Classic Disco "Shaft" style funky auto-wah)
    const root = CHORD_ROOTS[bar % 4];
    // Funky wah lick notes
    const lickNotes = [root, root + 3, root + 5, root + 7];
    const n = lickNotes[beat % lickNotes.length];
    const freq = midiToHz(n);

    const dur = SPB * 0.85;
    const g = this._out(0.18, t, dur, 0.35);

    // Auto-Wah bandpass resonant sweep
    const wah = this.ctx.createBiquadFilter();
    wah.type = 'bandpass';
    wah.Q.value = 4.5;
    wah.frequency.setValueAtTime(450, t);
    wah.frequency.exponentialRampToValueAtTime(2200, t + dur * 0.35);
    wah.frequency.exponentialRampToValueAtTime(500, t + dur);

    // Clean guitar tone source
    const o1 = this.ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    const o2 = this.ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq; o2.detune.value = 4;
    const og = this.ctx.createGain(); og.gain.value = 0.35;
    o2.connect(og);

    o1.connect(wah);
    og.connect(wah);
    wah.connect(g);

    o1.start(t); o1.stop(t + dur + 0.1);
    o2.start(t); o2.stop(t + dur + 0.1);
  }

  // ================================================================
  //  MELODIES — warm, musical
  // ================================================================

  // ================================================================
  //  MELODIES — E-Bass, Clean Rhythm Guitar, Rhodes, Clean Lead
  // ================================================================

  bassGroove(beat, bar, t) {
    // Authentic 70s Fender Precision Fingerstyle E-Bass (Bernard Edwards / Chic style)
    const rootNote = CHORD_ROOTS[beat % 4] - 12;
    const freq1 = midiToHz(rootNote);
    const freq5 = midiToHz(rootNote + 7);
    const octFreq = midiToHz(rootNote + 12);

    // Dynamic 16th disco groove: root on beat, ghost pluck at +0.25, octave slap at +0.5, 5th at +0.75
    const bassHits = [
      { offset: 0, f: freq1, dur: SPB * 0.42, vol: 0.38, slap: false },
      { offset: SPB * 0.25, f: freq1, dur: 0.08, vol: 0.18, slap: false }, // Ghost touch
      { offset: SPB * 0.5, f: (beat % 2 === 1 ? octFreq : freq5), dur: SPB * 0.38, vol: 0.34, slap: true },
      { offset: SPB * 0.75, f: freq1, dur: 0.09, vol: 0.2, slap: false }
    ];

    bassHits.forEach(h => {
      const hitTime = t + h.offset;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, hitTime);
      g.gain.linearRampToValueAtTime(h.vol, hitTime + 0.004); // Finger pluck transient
      g.gain.exponentialRampToValueAtTime(0.0001, hitTime + h.dur);

      // Bass Cabinet & Pickup Emulation (Ampeg SVT cabinet curve)
      const cab = this.ctx.createBiquadFilter();
      cab.type = 'lowpass';
      cab.frequency.setValueAtTime(h.slap ? 1100 : 750, hitTime);
      cab.frequency.exponentialRampToValueAtTime(320, hitTime + h.dur);
      cab.Q.value = 1.6;

      const bodyRes = this.ctx.createBiquadFilter();
      bodyRes.type = 'peaking';
      bodyRes.frequency.value = 120;
      bodyRes.gain.value = 4;

      // Finger Pluck Attack thump
      const thump = this.ctx.createOscillator();
      thump.type = 'sine';
      thump.frequency.setValueAtTime(140, hitTime);
      thump.frequency.exponentialRampToValueAtTime(h.f, hitTime + 0.02);
      const thumpG = this.ctx.createGain();
      thumpG.gain.setValueAtTime(h.vol * 0.6, hitTime);
      thumpG.gain.exponentialRampToValueAtTime(0.0001, hitTime + 0.035);
      thump.connect(thumpG);
      thumpG.connect(cab);
      thump.start(hitTime); thump.stop(hitTime + 0.04);

      // Dual pickups (Neck warm triangle + Bridge punchy saw)
      const o1 = this.ctx.createOscillator();
      o1.type = 'triangle';
      o1.frequency.setValueAtTime(h.f, hitTime);

      const o2 = this.ctx.createOscillator();
      o2.type = 'sawtooth';
      o2.frequency.setValueAtTime(h.f, hitTime);
      const o2G = this.ctx.createGain();
      o2G.gain.value = 0.28;
      o2.connect(o2G);

      const sat = this.ctx.createWaveShaper();
      sat.curve = this._warmSatCurve;

      o1.connect(sat);
      o2G.connect(sat);
      sat.connect(bodyRes);
      bodyRes.connect(cab);
      cab.connect(g);

      const dg = this.ctx.createGain(); dg.gain.value = 1.0;
      const wg = this.ctx.createGain(); wg.gain.value = 0.12; // Tight bass, subtle room
      g.connect(dg); dg.connect(this.dryBus);
      g.connect(wg); wg.connect(this.wetBus);

      o1.start(hitTime); o1.stop(hitTime + h.dur + 0.05);
      o2.start(hitTime); o2.stop(hitTime + h.dur + 0.05);
    });
  }

  funkyClavinet(beat, bar, t) {
    // Nile Rodgers Clean Disco Rhythm Guitar ("Chucking" strum pattern)
    const chord = CHORD_TONES[beat % 4];
    // Funky 16th chuck pattern: 1, 2-and, 3-e-and, 4
    const pattern = [
      { dt: 0, muted: false, vol: 0.14 },
      { dt: SPB * 0.25, muted: true, vol: 0.11 },
      { dt: SPB * 0.5, muted: false, vol: 0.13 },
      { dt: SPB * 0.75, muted: true, vol: 0.11 }
    ];

    pattern.forEach(p => {
      const pTime = t + p.dt;
      // Strum upper 3 strings of the chord (typical funk disco rhythm technique)
      chord.slice(1, 4).forEach((n, idx) => {
        const strTime = pTime + idx * 0.0035;
        this._guitarNote(midiToHz(n + 12), strTime, 0.18, p.vol, p.muted, 0.28);
      });
    });
  }

  discoChord(beat, bar, t) {
    if (beat !== 0) return;
    // Classic Fender Rhodes Mark I 73 Electric Piano with bell harmonics and stereo tremolo
    const chord = CHORD_TONES[bar % 4];
    const dur = LOOP * 0.95;

    chord.forEach((n, i) => {
      const freq = midiToHz(n);
      const noteTime = t + i * 0.008; // Arpeggiated finger roll

      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, noteTime);
      g.gain.linearRampToValueAtTime(0.12, noteTime + 0.015);
      g.gain.exponentialRampToValueAtTime(0.05, noteTime + 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, noteTime + dur);

      // Rhodes Tine Bell Tone (metallic sine partial at 7x fundamental)
      const tine = this.ctx.createOscillator();
      tine.type = 'sine';
      tine.frequency.setValueAtTime(freq * 7.1, noteTime);
      const tineG = this.ctx.createGain();
      tineG.gain.setValueAtTime(0.035, noteTime);
      tineG.gain.exponentialRampToValueAtTime(0.0001, noteTime + 0.18);
      tine.connect(tineG);

      // Rhodes Tone Bar (Main body: Sine + subtle 2nd & 3rd harmonic)
      const o1 = this.ctx.createOscillator();
      o1.type = 'sine';
      o1.frequency.setValueAtTime(freq, noteTime);

      const o2 = this.ctx.createOscillator();
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(freq * 2, noteTime);
      const o2G = this.ctx.createGain();
      o2G.gain.value = 0.22;
      o2.connect(o2G);

      // Warm preamp lowpass
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2400;

      o1.connect(lp);
      o2G.connect(lp);
      tineG.connect(lp);
      lp.connect(g);

      const dg = this.ctx.createGain(); dg.gain.value = 0.8;
      const wg = this.ctx.createGain(); wg.gain.value = 0.45;
      g.connect(dg); dg.connect(this.dryBus);
      g.connect(wg); wg.connect(this.wetBus);

      tine.start(noteTime); tine.stop(noteTime + 0.2);
      o1.start(noteTime); o1.stop(noteTime + dur + 0.1);
      o2.start(noteTime); o2.stop(noteTime + dur + 0.1);
    });
  }

  arpeggioRun(beat, bar, t) {
    // Clean Electric Guitar Lead Melody (Smooth Santana / George Benson jazz-disco fingerpicking)
    const chord = CHORD_TONES[beat % 4];
    const stepTime = SPB / 4;

    // Melodic sequence on the beat
    const sequence = [chord[0], chord[2], chord[1], chord[3]];

    sequence.forEach((n, idx) => {
      const noteTime = t + idx * stepTime;
      const freq = midiToHz(n + 12);
      this._guitarNote(freq, noteTime, stepTime * 1.2, 0.16, false, 0.4);
    });
  }

  metalRiff(beat, bar, t) {
    if (beat !== 0 && beat !== 2) return;
    // Style-alien: Electric Guitar Rock Power Chords (Vintage 70s Marshall crunch)
    const rootNote = CHORD_ROOTS[beat % 4] - 12;
    const f1 = midiToHz(rootNote);
    const f5 = midiToHz(rootNote + 7);
    const f8 = midiToHz(rootNote + 12);

    [f1, f5, f8].forEach((freq, idx) => {
      const noteTime = t + idx * 0.003;
      const g = this._drumOut(0.18, noteTime, SPB * 0.82, 0.35);

      // Marshall cabinet sim (lowpass cut at 3.2kHz, resonant 2.5kHz peak)
      const cab = this.ctx.createBiquadFilter();
      cab.type = 'lowpass'; cab.frequency.value = 3200; cab.Q.value = 1.0;
      const mid = this.ctx.createBiquadFilter();
      mid.type = 'peaking'; mid.frequency.value = 1800; mid.gain.value = 4;

      const ws = this.ctx.createWaveShaper();
      ws.curve = this._hardClipCurve;

      const o1 = this.ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
      const o2 = this.ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = freq; o2.detune.value = 5;

      o1.connect(ws);
      o2.connect(ws);
      ws.connect(mid);
      mid.connect(cab);
      cab.connect(g);

      o1.start(noteTime); o1.stop(noteTime + SPB);
      o2.start(noteTime); o2.stop(noteTime + SPB);
    });
  }

  // ================================================================
  //  VOICES — Natural Human Singing & Chants (Acoustic Formant Resonance)
  // ================================================================

  vocalComeOn(beat, bar, t) {
    if (beat !== 0) return;
    // Natural Female / Male Disco Vocal Hook: "Come on!"
    // Formants for /kʌm/ ("Come"): F1=640, F2=1190, F3=2400
    // Formants for /ɒn/ ("On"): F1=750, F2=1100, F3=2550
    const formCome = [[640, 7.5, 0.55], [1190, 9.0, 0.35], [2400, 11.0, 0.15]];
    const formOn   = [[750, 7.0, 0.60], [1100, 8.5, 0.38], [2550, 10.5, 0.16]];

    this._humanVoice(midiToHz(60), formCome, t, 0.22, 0.26, 0.08, 0.45);
    this._humanVoice(midiToHz(64), formOn,   t + 0.24, 0.32, 0.28, 0.10, 0.48);
  }

  vocalOohYeah(beat, bar, t) {
    if (beat !== 0 && beat !== 2) return;
    // Classic Soul / Disco Vocal Ad-lib: "Ooh-Yeah"
    // Formants for /uː/ ("Ooh"): F1=350, F2=850, F3=2300
    // Formants for /jɛə/ ("Yeah"): F1=680, F2=1750, F3=2600
    const formOoh  = [[350, 8.5, 0.65], [850, 11.0, 0.28], [2300, 13.0, 0.10]];
    const formYeah = [[680, 7.0, 0.55], [1750, 8.5, 0.38], [2600, 10.5, 0.18]];

    this._humanVoice(midiToHz(64), formOoh,  t, 0.26, 0.24, 0.06, 0.5);
    this._humanVoice(midiToHz(67), formYeah, t + 0.24, 0.38, 0.26, 0.08, 0.55);
  }

  vocalDance(beat, bar, t) {
    if (beat !== 0) return;
    // Disco Vocal Chorus: "Cel-e-brate!"
    // /sɛl/ - F1=580, F2=1780, F3=2500
    // /ɪ/   - F1=420, F2=1980, F3=2600
    // /breɪt/ - F1=620, F2=1500, F3=2450
    const formCel = [[580, 8.0, 0.5], [1780, 9.5, 0.35], [2500, 11.0, 0.12]];
    const formE   = [[420, 8.5, 0.45], [1980, 10.0, 0.32], [2600, 11.5, 0.10]];
    const formBrate = [[620, 7.5, 0.55], [1500, 9.0, 0.36], [2450, 10.5, 0.14]];

    this._humanVoice(midiToHz(60), formCel,   t, 0.15, 0.22, 0.05, 0.42);
    this._humanVoice(midiToHz(62), formE,     t + 0.16, 0.14, 0.22, 0.05, 0.42);
    this._humanVoice(midiToHz(65), formBrate, t + 0.32, 0.36, 0.25, 0.10, 0.46);
  }

  vocalScat(beat, bar, t) {
    // Funky Ella Fitzgerald / George Benson Style Expressive Scat Singing
    // "Da-ba-da-bop, doo-wop"
    const scatNotes = [
      { t: 0,           n: 55, form: [[650, 7.0, 0.55], [1200, 8.5, 0.35], [2500, 10, 0.12]] }, // "Da"
      { t: SPB * 0.25,  n: 58, form: [[520, 8.0, 0.50], [1450, 9.0, 0.30], [2400, 11, 0.10]] }, // "Ba"
      { t: SPB * 0.5,   n: 60, form: [[680, 7.0, 0.55], [1150, 8.5, 0.38], [2600, 10, 0.14]] }, // "Da"
      { t: SPB * 0.75,  n: 62, form: [[480, 9.0, 0.60], [920, 11.0, 0.25], [2300, 12, 0.08]] }  // "Bop"
    ];

    scatNotes.forEach(s => {
      this._humanVoice(midiToHz(s.n), s.form, t + s.t, 0.14, 0.18, 0.04, 0.38);
    });
  }

  vocalRobot(beat, bar, t) {
    // Style-alien vocal: Kraftwerk / Daft Punk style Talkbox Vocoder
    const freq = midiToHz(CHORD_ROOTS[beat % 4]);
    const dur = SPB * 0.72;
    const g = this._out(0.2, t, dur, 0.38);
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2800; lp.Q.value = 0.5;
    lp.connect(g);

    // Pulse carrier
    const o1 = this.ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = freq;
    const o2 = this.ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = freq; o2.detune.value = 8;

    // Vocoder robot bandpass bank
    [[450, 9.0], [1150, 8.0], [2100, 7.0]].forEach(([ff, q]) => {
      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
      const fg = this.ctx.createGain(); fg.gain.value = 0.45;
      o1.connect(bp);
      o2.connect(bp);
      bp.connect(fg);
      fg.connect(lp);
    });

    o1.start(t); o1.stop(t + dur + 0.08);
    o2.start(t); o2.stop(t + dur + 0.08);
  }
}

const engine = new AudioEngine();
let state = {
  playing:   false,
  muteAll:   false,
  assignments: {}, // charId -> soundId
  muted:     new Set(),
  soloChar:  null,
};

function saveState() {
  const s = {
    playing: state.playing,
    muteAll: state.muteAll,
    assignments: state.assignments,
    muted: [...state.muted],
  };
  try { localStorage.setItem('beatcrew_mix', JSON.stringify(s)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem('beatcrew_mix');
    if (!raw) return;
    const s = JSON.parse(raw);
    state.assignments = s.assignments || {};
    state.muted       = new Set(s.muted || []);
  } catch(e) {}
}

/* --- Stage lights --- */
function buildStageLights() {
  const wrap = document.getElementById('stage-lights');
  const colors = ['#FFD700','#EC4899','#A855F7','#22D3EE','#34D399','#F97316'];
  for (let i=0; i<6; i++) {
    const el = document.createElement('div');
    el.className = 'stage-light';
    el.style.left = `${10 + i*16}%`;
    el.style.background = `linear-gradient(to bottom, ${colors[i]}44 0%, transparent 100%)`;
    el.style.animationDelay = `${i * 0.7}s`;
    el.style.animationDuration = `${3 + i * 0.5}s`;
    wrap.appendChild(el);
  }
}

/* --- Disco ball facets --- */
function buildDiscoBall() {
  const g = document.getElementById('disco-facets');
  const rows=6, cols=8;
  for(let r=0;r<rows;r++) {
    for(let c=0;c<cols;c++) {
      const angle = (c/cols)*360;
      const y     = 18 + r*4;
      const hue   = (r*60+c*45)%360;
      const rect  = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x', 8 + c*5.5);
      rect.setAttribute('y', y);
      rect.setAttribute('width', 4.5);
      rect.setAttribute('height', 3.5);
      rect.setAttribute('rx', 0.5);
      rect.setAttribute('fill', `hsl(${hue},80%,70%)`);
      rect.setAttribute('transform', `rotate(${angle},30,38)`);
      g.appendChild(rect);
    }
  }
  // animate spin
  const ball = document.getElementById('disco-ball');
  let ang=0;
  setInterval(()=>{ ang+=0.3; ball.style.transform=`translateX(-50%) rotate(${ang}deg)`; },30);
}

  bandana:    ()=>`<path d="M18 30 Q40 20 62 30 L60 38 Q40 28 20 38Z" fill="#EF4444"/>`,
  antenna:    ()=>`<line x1="40" y1="16" x2="40" y2="2" stroke="#A855F7" stroke-width="3"/><circle cx="40" cy="2" r="4" fill="#EC4899"/>`,
};

function renderAccessory(charId, soundId) {
  const acc = document.getElementById(`acc-${charId}`);
  if (!acc) return;
  if (!soundId) { acc.innerHTML = ''; return; }
  const sound = SOUNDS.find(s => s.id === soundId);
  if (!sound) { acc.innerHTML = ''; return; }
  const fn = ACCESSORY_SVG[sound.accessory];
  const char = CHAR_DEFS[charId];
  acc.innerHTML = fn ? fn(char.hair, charId) : '';
}

function buildCharacters() {
  const wrap = document.getElementById('characters');
  CHAR_DEFS.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'char-wrap';
    div.dataset.charid = ch.id;
    div.innerHTML = `
      <div class="char-svg-wrap" id="char-svg-${ch.id}">
        ${buildCharSVG(ch, ch.id)}
      </div>
      
      <div class="char-glow" style="background:var(--gold);"></div>
    `;
    wrap.appendChild(div);
    setupCharInteraction(div, ch.id);
  });
}

function buildSoundGrid() {
  const grid = document.getElementById('sound-grid');

  // Shuffle all 20 sounds randomly
  const shuffled = [...SOUNDS].sort(() => Math.random() - 0.5);

  // Category color lookup
  const catColor = {};
  CATEGORIES.forEach(c => catColor[c.id] = c.color);

  const row = document.createElement('div');
  row.className = 'category-row';
  row.style.flexWrap = 'wrap';
  row.style.justifyContent = 'center';
  row.style.gap = '5px';

  shuffled.forEach(sound => {
    const col = catColor[sound.cat];
    const el = document.createElement('div');
    el.className = 'sound-icon';
    el.id = `icon-${sound.id}`;
    el.dataset.soundid = sound.id;
    el.style.background = col + '22';
    el.style.borderColor = col + '66';
    el.style.color = col;
    el.innerHTML = `<div class="icon-emoji">${sound.emoji}</div><div class="icon-label">${sound.name}</div>`;
    row.appendChild(el);
    setupIconInteraction(el, sound);
  });

  grid.appendChild(row);
}

// ----------------------------------------------------------------
// DRAG & DROP
// ----------------------------------------------------------------
let dragging = null; // { soundId, startX, startY, ghostEl }
let longPressTimer = null;

function setupIconInteraction(el, sound) {
  // Mouse drag
  el.addEventListener('mousedown', e => {
    if (el.classList.contains('assigned')) return;
    startDrag(sound, e.clientX, e.clientY, el);
    e.preventDefault();
  });
  // Touch drag
  el.addEventListener('touchstart', e => {
    if (el.classList.contains('assigned')) return;
    const t = e.touches[0];
    startDrag(sound, t.clientX, t.clientY, el);
    e.preventDefault();
  }, { passive: false });
}

function startDrag(sound, x, y, srcEl) {
  dragging = { soundId: sound.id, srcEl };
  const ghost = document.getElementById('drag-ghost');
  ghost.textContent = sound.emoji;
  ghost.style.fontSize = '2.4rem';
  ghost.style.display  = 'block';
  moveDragGhost(x, y);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragEnd);
  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend',  onTouchEnd);
  highlightDropZones(true);
}

function moveDragGhost(x, y) {
  const ghost = document.getElementById('drag-ghost');
  ghost.style.left = (x - 24) + 'px';
  ghost.style.top  = (y - 24) + 'px';
}

function onDragMove(e) { moveDragGhost(e.clientX, e.clientY); updateDropHighlight(e.clientX, e.clientY); }
function onTouchMove(e) {
  const t = e.touches[0];
  moveDragGhost(t.clientX, t.clientY);
  updateDropHighlight(t.clientX, t.clientY);
  e.preventDefault();
}

function onDragEnd(e)  { endDrag(e.clientX, e.clientY); }
function onTouchEnd(e) {
  const t = e.changedTouches[0];
  endDrag(t.clientX, t.clientY);
}

function endDrag(x, y) {
  document.getElementById('drag-ghost').style.display = 'none';
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup',   onDragEnd);
  document.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchend',  onTouchEnd);
  highlightDropZones(false);

  if (!dragging) return;
  const soundId = dragging.soundId;
  dragging = null;

  // Find char under cursor
  const charWrap = findCharAt(x, y);
  if (charWrap) {
    const charId = parseInt(charWrap.dataset.charid);
    assignSound(charId, soundId);
    charWrap.classList.remove('drag-over');
  }
}

function findCharAt(x, y) {
  const els = document.elementsFromPoint(x, y);
  for (const el of els) {
    const wrap = el.closest('.char-wrap');
    if (wrap) return wrap;
  }
  return null;
}

function updateDropHighlight(x, y) {
  document.querySelectorAll('.char-wrap').forEach(w => w.classList.remove('drag-over'));
  const ch = findCharAt(x, y);
  if (ch) ch.classList.add('drag-over');
}

function highlightDropZones(on) {
  document.querySelectorAll('.char-wrap').forEach(w => {
    w.style.outline = on ? '2px dashed rgba(255,215,0,.4)' : '';
  });
}

// ----------------------------------------------------------------
// CHARACTER INTERACTION
// ----------------------------------------------------------------
function setupCharInteraction(el, charId) {
  // Click = toggle mute
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (dragging) return;
    if (!state.assignments[charId]) return;
    toggleMute(charId);
  });

  // Drag char down = remove sound
  let dragStartY = null;
  el.addEventListener('mousedown', e => {
    dragStartY = e.clientY;
    const onMU = e2 => {
      if (Math.abs(e2.clientY - dragStartY) > 50 && state.assignments[charId]) {
        removeSound(charId);
        showToast(`${CHAR_DEFS[charId].name} ist frei 🎉`);
      }
      document.removeEventListener('mouseup', onMU);
    };
    document.addEventListener('mouseup', onMU);
  });

  // Long press = solo
  el.addEventListener('pointerdown', e => {
    longPressTimer = setTimeout(() => {
      if (state.assignments[charId]) {
        activateSolo(charId);
      }
    }, 500);
  });
  el.addEventListener('pointerup',    () => clearTimeout(longPressTimer));
  el.addEventListener('pointerleave', () => clearTimeout(longPressTimer));
}

// ----------------------------------------------------------------
// SOUND ASSIGNMENT
// ----------------------------------------------------------------
function assignSound(charId, soundId) {
  // Find if this sound is already assigned to another char
  for (const [cid, sid] of Object.entries(state.assignments)) {
    if (sid === soundId && parseInt(cid) !== charId) {
      removeSound(parseInt(cid));
    }
  }
  // Replace existing
  const old = state.assignments[charId];
  if (old && old !== soundId) {
    markIconAssigned(old, false);
  }
  state.assignments[charId] = soundId;
  engine.activeSlots[charId] = soundId;
  markIconAssigned(soundId, true);
  renderAccessory(charId, soundId);
  activateChar(charId, true);
  spawnParticles(charId);
  saveState();

  // Auto-play
  if (!state.playing) {
    startPlayback();
  }
}

function removeSound(charId) {
  const soundId = state.assignments[charId];
  if (!soundId) return;
  delete state.assignments[charId];
  delete engine.activeSlots[charId];
  markIconAssigned(soundId, false);
  renderAccessory(charId, null);
  activateChar(charId, false);
  state.muted.delete(charId);
  engine.mutedChars.delete(charId);
  updateCharMuteVisual(charId);
  if (state.soloChar === charId) deactivateSolo();
  saveState();
}

function markIconAssigned(soundId, val) {
  const el = document.getElementById(`icon-${soundId}`);
  if (el) el.classList.toggle('assigned', val);
}

function activateChar(charId, active) {
  const wrap = document.querySelector(`.char-wrap[data-charid="${charId}"]`);
  if (!wrap) return;
  wrap.classList.toggle('active', active);
}

function toggleMute(charId) {
  if (state.muted.has(charId)) {
    state.muted.delete(charId);
    engine.mutedChars.delete(charId);
  } else {
    state.muted.add(charId);
    engine.mutedChars.add(charId);
  }
  updateCharMuteVisual(charId);
  saveState();
}

function updateCharMuteVisual(charId) {
  const wrap = document.querySelector(`.char-wrap[data-charid="${charId}"]`);
  if (!wrap) return;
  wrap.classList.toggle('muted', state.muted.has(charId));
}

function activateSolo(charId) {
  if (state.soloChar === charId) { deactivateSolo(); return; }
  state.soloChar     = charId;
  engine.soloChar    = charId;
  document.querySelectorAll('.char-wrap').forEach(w => {
    const cid = parseInt(w.dataset.charid);
    w.classList.remove('solo-active', 'solo-dimmed');
    if (cid === charId) w.classList.add('solo-active');
    else if (state.assignments[cid]) w.classList.add('solo-dimmed');
  });
  showToast(`${CHAR_DEFS[charId].name} solo 🎸`);
}

function deactivateSolo() {
  state.soloChar  = null;
  engine.soloChar = null;
  document.querySelectorAll('.char-wrap').forEach(w => {
    w.classList.remove('solo-active', 'solo-dimmed');
  });
}

// ----------------------------------------------------------------
// PLAYBACK CONTROLS
// ----------------------------------------------------------------
async function startPlayback() {
  await engine.init();
  if (engine.ctx.state === 'suspended') await engine.ctx.resume();
  engine.start();
  state.playing = true;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-play').innerHTML = `
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Stop`;
}

function stopPlayback() {
  engine.stop();
  state.playing = false;
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-play').innerHTML = `
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play`;
}

function resetAll() {
  stopPlayback();
  deactivateSolo();
  Object.keys(state.assignments).forEach(cid => removeSound(parseInt(cid)));
  state.muted.clear();
  engine.mutedChars.clear();
  engine.activeSlots = {};
  saveState();
  showToast('Reset! 🎉');
}

// ----------------------------------------------------------------
// CONTROLS
// ----------------------------------------------------------------
document.getElementById('btn-play').addEventListener('click', async () => {
  if (state.playing) stopPlayback(); else await startPlayback();
});

document.getElementById('btn-mute').addEventListener('click', () => {
  state.muteAll = !state.muteAll;
  document.getElementById('btn-mute').classList.toggle('active', state.muteAll);
  if (state.muteAll) {
    engine.master.gain.setTargetAtTime(0.001, engine.ctx?.currentTime||0, 0.1);
  } else {
    if (engine.ctx) engine.master.gain.setTargetAtTime(0.82, engine.ctx.currentTime, 0.1);
  }
});

document.getElementById('btn-reset').addEventListener('click', resetAll);

// ----------------------------------------------------------------
// ANIMATIONS — beat-synced
// ----------------------------------------------------------------
engine.onBeat = (beat, t) => {
  animateBeat(beat);
};

function animateBeat(beat) {
  Object.entries(state.assignments).forEach(([charIdStr, soundId]) => {
    const charId = parseInt(charIdStr);
    if (state.muted.has(charId)) return;
    if (state.soloChar !== null && state.soloChar !== charId) return;
    const sound = SOUNDS.find(s => s.id === soundId);
    if (!sound) return;
    animateChar(charId, sound.anim, beat);
  });
  pulseLights(beat);
}

function animateChar(charId, anim, beat) {
  const svgWrap = document.getElementById(`char-svg-${charId}`);
  if (!svgWrap) return;
  const head  = svgWrap.querySelector(`#head-${charId}`);
  const armL  = svgWrap.querySelector(`#arm-l-${charId}`);
  const armR  = svgWrap.querySelector(`#arm-r-${charId}`);
  const mouth = svgWrap.querySelector(`#mouth-${charId}`);
  const foot  = svgWrap.querySelector(`#foot-l-${charId}`);

  const pulse = (el, prop, from, to, dur) => {
    if (!el) return;
    el.style.transition = `${prop} ${dur}ms ease-out`;
    el.style[prop] = from;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        el.style[prop] = to;
        setTimeout(() => { el.style[prop] = from; }, dur * 1.5);
      });
    });
  };

  if (anim === 'beat') {
    pulse(head, 'transform', 'translateY(0)', 'translateY(-5px)', 100);
    if (beat % 2 === 0) pulse(foot, 'transform', 'rotate(0deg)', 'rotate(10deg)', 100);
  } else if (anim === 'effect') {
    pulse(armL, 'transform', 'rotate(0deg)', 'rotate(-25deg)', 120);
    pulse(armR, 'transform', 'rotate(0deg)', 'rotate(25deg)',  120);
    pulse(svgWrap.parentElement, 'transform', 'scale(1)', 'scale(1.04)', 100);
  } else if (anim === 'melody') {
    pulse(svgWrap.parentElement, 'transform', 'rotate(0deg)', 'rotate(2deg)', 150);
    pulse(head, 'transform', 'translateX(0)', 'translateX(3px)', 150);
  } else if (anim === 'voice') {
    if (mouth) {
      mouth.style.transition = 'd 100ms';
      const open  = `M33 55 Q40 65 47 55`;
      const close = `M33 57 Q40 63 47 57`;
      mouth.setAttribute('d', open);
      setTimeout(() => mouth.setAttribute('d', close), 120);
    }
    pulse(armR, 'transform', 'rotate(0deg)', 'rotate(-15deg)', 100);
  }
}

function pulseLights(beat) {
  const lights = document.querySelectorAll('.stage-light');
  lights.forEach((l, i) => {
    if (i === beat % lights.length) {
      l.style.opacity = '0.14';
      setTimeout(() => { l.style.opacity = ''; }, 200);
    }
  });
}

// ----------------------------------------------------------------
// PARTICLES
// ----------------------------------------------------------------
function spawnParticles(charId) {
  const wrap = document.querySelector(`.char-wrap[data-charid="${charId}"]`);
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const emojis = ['✨','⭐','🌟','💫','🎵','🎶'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.style.cssText = `
      position:fixed;
      left:${rect.left + rect.width/2 + (Math.random()-0.5)*60}px;
      top:${rect.top + rect.height/2}px;
      font-size:${1+Math.random()}rem;
      pointer-events:none;
      z-index:999;
      animation: particleFly ${0.5+Math.random()*0.5}s ease-out forwards;
      animation-delay:${i*0.05}s;
    `;
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }
}

// ----------------------------------------------------------------
// BACKGROUND CANVAS  — grid + particles
// ----------------------------------------------------------------
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles=[];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Grid of dots
  function drawGrid() {
    ctx.clearRect(0, 0, W, H);
    // gradient bg
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0D0817');
    g.addColorStop(1, '#1A0F35');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,215,0,.04)';
    const step = 40;
    for (let x=0; x<W; x+=step) {
      for (let y=0; y<H; y+=step) {
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  // Floating particles
  for (let i=0; i<60; i++) {
    particles.push({
      x: Math.random()*1000, y: Math.random()*800,
      r: Math.random()*2+.5,
      vx: (Math.random()-.5)*.3,
      vy: (Math.random()-.5)*.3,
      hue: Math.random()*360,
      alpha: Math.random()*.6+.1
    });
  }

  function drawParticles() {
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x<0) p.x=W; if (p.x>W) p.x=0;
      if (p.y<0) p.y=H; if (p.y>H) p.y=0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},80%,70%,${p.alpha})`;
      ctx.fill();
    });
  }

  // Glow rings (beat-reactive)
  let glowR = 0, glowAlpha = 0;
  window._beatGlow = () => { glowR=0; glowAlpha=.4; };

  function drawGlow() {
    if (glowAlpha > 0) {
      ctx.beginPath();
      ctx.arc(W/2, H/2, glowR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,215,0,${glowAlpha})`;
      ctx.lineWidth = 3;
      ctx.stroke();
      glowR    += 8;
      glowAlpha = Math.max(0, glowAlpha - 0.025);
    }
  }

  function loop() {
    drawGrid();
    drawParticles();
    drawGlow();
    requestAnimationFrame(loop);
  }
  loop();
})();

// ----------------------------------------------------------------
// VISUALIZER
// ----------------------------------------------------------------
(function() {
  const canvas = document.getElementById('visualizer');
  const ctx    = canvas.getContext('2d');

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width  = Math.min(320, rect.width * .9);
    canvas.height = 36;
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    requestAnimationFrame(draw);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!engine.analyser) {
      // idle bars
      const bars = 32;
      const bw   = canvas.width / bars;
      for (let i=0; i<bars; i++) {
        const h = 4 + Math.sin(Date.now()/400 + i*0.5) * 3;
        ctx.fillStyle = `hsla(${i*11},80%,60%,.35)`;
        ctx.fillRect(i*bw+1, (canvas.height-h)/2, bw-2, h);
      }
      return;
    }

    const data = new Uint8Array(engine.analyser.frequencyBinCount);
    engine.analyser.getByteFrequencyData(data);
    const bars = 32;
    const step = Math.floor(data.length / bars);
    const bw   = canvas.width / bars;

    for (let i=0; i<bars; i++) {
      let sum=0;
      for (let j=0; j<step; j++) sum += data[i*step+j];
      const v = sum / step / 255;
      const h = Math.max(2, v * canvas.height);
      const hue = i * 11;
      ctx.fillStyle = `hsla(${hue},90%,60%,.8)`;
      ctx.fillRect(i*bw+1, (canvas.height-h)/2, bw-2, h);
    }
  }
  draw();
})();

// ----------------------------------------------------------------
// TOAST
// ----------------------------------------------------------------
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ----------------------------------------------------------------
// RESTORE STATE
// ----------------------------------------------------------------
function restoreState() {
  loadState();
  Object.entries(state.assignments).forEach(([charIdStr, soundId]) => {
    const charId = parseInt(charIdStr);
    engine.activeSlots[charId] = soundId;
    markIconAssigned(soundId, true);
    renderAccessory(charId, soundId);
    activateChar(charId, true);
    if (state.muted.has(charId)) {
      engine.mutedChars.add(charId);
      updateCharMuteVisual(charId);
    }
  });
  if (Object.keys(state.assignments).length > 0) {
    showToast('Letzter Mix geladen! 🎶');
  }
}

// ----------------------------------------------------------------
// KICK IT
// ----------------------------------------------------------------
buildStageLights();
buildDiscoBall();
buildCharacters();
buildSoundGrid();
restoreState();

// Hook beat glow to background
engine.onBeat = (beat, t) => {
  animateBeat(beat);
  if (typeof window._beatGlow === 'function') window._beatGlow();
};

// BPM display removed

console.log('🎵 BeatCrew ready! Drag sounds onto your crew!');
